# Deploy Infrastructure Workflow
#
# This workflow provisions AWS infrastructure via Terraform and deploys the WebUI.
#
# Required GitHub Secrets:
#   - AWS_ROLE_ARN: IAM role ARN for OIDC authentication (e.g. arn:aws:iam::123456789012:role/github-actions)
#   - TF_STATE_BUCKET: S3 bucket name for Terraform remote state
#
# Required GitHub Variables (optional):
#   - AWS_REGION: AWS region to deploy to (defaults to us-east-1 if not set)
#
# OIDC IAM Role Setup:
#   1. Create an IAM OIDC identity provider for token.actions.githubusercontent.com
#   2. Create an IAM role with a trust policy that allows the GitHub OIDC provider
#      to assume the role, scoped to your repository.
#   3. Attach policies granting the role permissions for S3, DynamoDB, API Gateway,
#      Lambda, CloudFront, and any other resources Terraform manages.
#   See: https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services

name: Deploy AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Build Lambda package
        run: python scripts/build_lambda_package.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/aws
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Terraform Plan
        working-directory: terraform/aws
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars"

      - name: Terraform Apply
        working-directory: terraform/aws
        run: |
          terraform apply -auto-approve \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars"

      - name: Deploy WebUI
        working-directory: terraform/aws
        run: |
          BUCKET_NAME=$(terraform output -raw website_bucket_name)
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)

          aws s3 sync ../../webui/ "s3://${BUCKET_NAME}" --delete

          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Print outputs
        working-directory: terraform/aws
        run: |
          echo "API Invoke URL: $(terraform output -raw api_invoke_url)"
          echo "CloudFront URL: $(terraform output -raw cloudfront_url)"
