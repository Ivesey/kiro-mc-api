# Teardown Azure Infrastructure Workflow
#
# This workflow destroys Azure infrastructure provisioned by Terraform.
# It supports tearing down a single environment or all three (dev, staging, prod) in sequence.
#
# Required GitHub Secrets:
#   - AZURE_CLIENT_ID: Azure AD application (client) ID for OIDC authentication
#   - AZURE_TENANT_ID: Azure AD tenant ID
#   - AZURE_SUBSCRIPTION_ID: Azure subscription ID
#   - AZURE_TF_STATE_RESOURCE_GROUP: Resource group containing the Terraform state storage account
#   - AZURE_TF_STATE_STORAGE_ACCOUNT: Storage account name for Terraform remote state
#   - AZURE_TF_STATE_CONTAINER: Blob container name for Terraform state files

name: Teardown Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    name: Teardown ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create placeholder ZIP
        run: |
          mkdir -p dist
          touch dist/azure_functions.zip

      - name: Destroy infrastructure
        working-directory: terraform/azure
        run: |
          set -e

          if [ "${{ github.event.inputs.environment }}" == "all" ]; then
            ENVIRONMENTS="dev staging prod"
          else
            ENVIRONMENTS="${{ github.event.inputs.environment }}"
          fi

          for ENV in $ENVIRONMENTS; do
            echo "::group::Destroying ${ENV}"

            terraform init -reconfigure \
              -backend-config="resource_group_name=${{ secrets.AZURE_TF_STATE_RESOURCE_GROUP }}" \
              -backend-config="storage_account_name=${{ secrets.AZURE_TF_STATE_STORAGE_ACCOUNT }}" \
              -backend-config="container_name=${{ secrets.AZURE_TF_STATE_CONTAINER }}" \
              -backend-config="key=${ENV}/terraform.tfstate"

            if ! terraform destroy -auto-approve -var-file="environments/${ENV}.tfvars"; then
              echo "## ❌ Teardown Failed" >> $GITHUB_STEP_SUMMARY
              echo "Failed to destroy ${ENV} environment." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            echo "::endgroup::"
          done

          echo "## ✅ Teardown Complete" >> $GITHUB_STEP_SUMMARY
          echo "Successfully destroyed: $ENVIRONMENTS" >> $GITHUB_STEP_SUMMARY
