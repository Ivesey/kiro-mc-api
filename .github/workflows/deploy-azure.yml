# Deploy Azure Infrastructure Workflow
#
# This workflow provisions Azure infrastructure via Terraform and deploys the WebUI.
#
# Required GitHub Secrets:
#   - AZURE_CLIENT_ID: Azure AD application (client) ID for OIDC authentication
#   - AZURE_TENANT_ID: Azure AD tenant ID
#   - AZURE_SUBSCRIPTION_ID: Azure subscription ID
#   - AZURE_TF_STATE_RESOURCE_GROUP: Resource group containing the Terraform state storage account
#   - AZURE_TF_STATE_STORAGE_ACCOUNT: Storage account name for Terraform remote state
#   - AZURE_TF_STATE_CONTAINER: Blob container name for Terraform state files
#
# OIDC Setup:
#   1. Create an Azure AD App Registration with a federated credential for GitHub Actions
#   2. Configure the federated credential to trust your repository's OIDC tokens
#   3. Assign the App Registration a role (e.g., Contributor) scoped to the target subscription
#   See: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure

name: Deploy Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Azure Functions package
        run: python scripts/build_azure_functions_package.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/azure
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.AZURE_TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.AZURE_TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.AZURE_TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Terraform Plan
        working-directory: terraform/azure
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars"

      - name: Terraform Apply
        working-directory: terraform/azure
        run: |
          terraform apply -auto-approve \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars"

      - name: Deploy WebUI
        working-directory: terraform/azure
        run: |
          STORAGE_NAME=$(terraform output -raw storage_account_name)

          az storage blob upload-batch \
            --destination '$web' \
            --source ../../webui/ \
            --account-name "$STORAGE_NAME" \
            --overwrite

      - name: Purge CDN cache
        working-directory: terraform/azure
        run: |
          RG=$(terraform output -raw resource_group_name)
          CDN_PROFILE=$(terraform output -raw cdn_profile_name)
          CDN_ENDPOINT=$(terraform output -raw cdn_endpoint_name)

          az cdn endpoint purge \
            --resource-group "$RG" \
            --profile-name "$CDN_PROFILE" \
            --name "$CDN_ENDPOINT" \
            --content-paths "/*"

      - name: Print outputs
        working-directory: terraform/azure
        run: |
          echo "Function App URL: $(terraform output -raw function_app_url)"
          echo "CDN URL: $(terraform output -raw cdn_url)"
